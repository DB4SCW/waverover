name: Build

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: "386"
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: "386"
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          go build -ldflags="-s -w" -o "waveRover_${GOOS}_${GOARCH}${ext}" .

      - uses: actions/upload-artifact@v4
        with:
          name: waveRover_${{ matrix.goos }}_${{ matrix.goarch }}
          path: waveRover_${{ matrix.goos }}_${{ matrix.goarch }}*

  build-macos:
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        run: go build -ldflags="-s -w" -o "waveRover_${{ matrix.goos }}_${{ matrix.goarch }}" .

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security import certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -k build.keychain -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k actions build.keychain
          security list-keychains -d user -s build.keychain
          rm certificate.p12

      - name: Sign and notarize
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          BINARY="waveRover_${{ matrix.goos }}_${{ matrix.goarch }}"
          codesign --sign "$APPLE_SIGNING_IDENTITY" --options runtime --timestamp --force "$BINARY"
          zip "${BINARY}.zip" "$BINARY"
          xcrun notarytool submit "${BINARY}.zip" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$BINARY" 2>/dev/null || echo "Staple skipped (standalone binary)"

      - uses: actions/upload-artifact@v4
        with:
          name: waveRover_${{ matrix.goos }}_${{ matrix.goarch }}
          path: waveRover_${{ matrix.goos }}_${{ matrix.goarch }}

  release:
    needs: [build, build-macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: Build ${{ github.sha }}
          files: artifacts/*
